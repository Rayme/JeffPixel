# Modified by JeffPixel on 2026-10-30: naming tests and distribution-license checks.
name: Build

on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Test output names
        run: npm test
      - name: Build production assets
        run: npm run build:prod
      - name: Check distribution licenses and fork identity
        run: npm run check:compliance
